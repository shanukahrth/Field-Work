<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reminders · FieldPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- App Preloader -->
<div id="app-preloader" aria-hidden="true">
  <div class="preloader-center">
    <div class="preloader-mark">FW</div>
    <div class="preloader-brand">FieldPro</div>
    <div class="preloader-spinner"></div>
  </div>
  <div class="preloader-footer">
    <div class="preloader-singer-badge">
      <img src="assets/img/singer-logo.png" alt="Singer Sri Lanka PLC">
    </div>
    <div class="preloader-credit">Designed by : Shanuka Herath</div>
  </div>
</div>
<script>
(function () {
  var el = document.getElementById('app-preloader');
  if (!el) return;
  var MIN_MS = 500, start = Date.now();
  function hide() {
    var wait = Math.max(0, MIN_MS - (Date.now() - start));
    setTimeout(function () {
      el.classList.add('is-hidden');
      setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 500);
    }, wait);
  }
  if (document.readyState === 'complete') hide();
  else window.addEventListener('load', hide);
  setTimeout(hide, 3000); // safety fallback in case load never fires
})();
</script>
<div class="app-wrapper">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main-content">
    <header id="topbar" class="topbar"></header>

    <main class="page-content">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
          <h2 class="fw-display fw-bold mb-1">Reminders</h2>
          <p class="text-muted-fw mb-0">Stay on top of what needs your attention.</p>
        </div>
        <button class="btn btn-primary d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#reminderModal">
          <span class="material-symbols-outlined" style="font-size:20px;">add_alert</span> New Reminder
        </button>
      </div>

      <div class="alert alert-primary d-flex align-items-center gap-2 py-2 small d-none" id="notifPermissionBanner">
        <span class="material-symbols-outlined" style="font-size:20px;">notifications</span>
        Enable browser notifications to get alerted the moment a reminder is due.
        <button class="btn btn-sm btn-primary ms-auto" id="enableNotifBtn">Enable</button>
      </div>

      <div class="row g-4">
        <div class="col-lg-8">
          <div class="card section-card">
            <div class="card-header"><h3 class="section-title">Upcoming</h3></div>
            <div class="card-body" id="upcomingRemindersList">
              <div class="text-center text-muted-fw py-3">Loading...</div>
            </div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="card section-card">
            <div class="card-header"><h3 class="section-title">Past Reminders</h3></div>
            <div class="card-body scroll-y-thin" id="pastRemindersList">
              <div class="text-center text-muted-fw py-3">Loading...</div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- New Reminder Modal -->
<div class="modal fade" id="reminderModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-display">New Reminder</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="reminderForm">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" class="form-control" id="rTitle" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea class="form-control" id="rMessage" rows="2"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Date &amp; Time</label>
            <input type="datetime-local" class="form-control" id="rDatetime" required>
          </div>
          <div class="mb-3" id="rForUserWrap" style="display:none;">
            <label class="form-label">For</label>
            <select class="form-select" id="rForUser"></select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Reminder</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/reminders.js"></script>
</body>
</html>
