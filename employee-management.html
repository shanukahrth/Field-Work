<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Management · FieldPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- App Preloader -->
<div id="app-preloader" aria-hidden="true">
  <div class="preloader-center">
    <div class="preloader-mark">FW</div>
    <div class="preloader-brand">FieldPro</div>
    <div class="preloader-spinner"></div>
  </div>
  <div class="preloader-footer">
    <div class="preloader-singer-badge">
      <img src="assets/img/singer-logo.png" alt="Singer Sri Lanka PLC">
    </div>
    <div class="preloader-credit">Designed by : Shanuka Herath</div>
  </div>
</div>
<script>
(function () {
  var el = document.getElementById('app-preloader');
  if (!el) return;
  var MIN_MS = 500, start = Date.now();
  function hide() {
    var wait = Math.max(0, MIN_MS - (Date.now() - start));
    setTimeout(function () {
      el.classList.add('is-hidden');
      setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 500);
    }, wait);
  }
  if (document.readyState === 'complete') hide();
  else window.addEventListener('load', hide);
  setTimeout(hide, 3000); // safety fallback in case load never fires
})();
</script>
<div class="app-wrapper">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main-content">
    <header id="topbar" class="topbar"></header>

    <main class="page-content">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
          <h2 class="fw-display fw-bold mb-1">Employee Management</h2>
          <p class="text-muted-fw mb-0">Create and manage field employee accounts.</p>
        </div>
        <button class="btn btn-primary d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#employeeModal" id="openCreateEmployeeBtn">
          <span class="material-symbols-outlined" style="font-size:20px;">person_add</span> Create Employee
        </button>
      </div>

      <!-- Filters -->
      <div class="filter-bar mb-4">
        <div class="row g-2 align-items-end">
          <div class="col-md-4">
            <label class="form-label mb-1">Search</label>
            <input type="text" class="form-control" id="filterSearch" placeholder="Search by name or email...">
          </div>
          <div class="col-md-3" id="filterManagerWrap">
            <label class="form-label mb-1">Manager</label>
            <select class="form-select" id="filterManager"><option value="">All Managers</option></select>
          </div>
          <div class="col-md-3">
            <label class="form-label mb-1">Status</label>
            <select class="form-select" id="filterStatus">
              <option value="">All Statuses</option>
              <option value="active">Active</option>
              <option value="disabled">Disabled</option>
            </select>
          </div>
          <div class="col-md-2">
            <button class="btn btn-light w-100" id="clearFiltersBtn">Clear</button>
          </div>
        </div>
      </div>

      <div class="card section-card">
        <div class="card-body p-0">
          <div class="table-responsive-card">
            <table class="table table-hover mb-0">
              <thead>
                <tr>
                  <th>Employee</th><th>Contact</th><th>Manager</th><th>Title</th><th>Status</th><th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="employeeTableBody">
                <tr><td colspan="6" class="text-center text-muted-fw py-4">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Create / Edit Employee Modal -->
<div class="modal fade" id="employeeModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-display" id="employeeModalTitle">Create Employee</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="employeeForm">
        <input type="hidden" id="empId">
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" id="empName" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-control" id="empEmail" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input type="text" class="form-control" id="empPhone">
            </div>
            <div class="col-md-6">
              <label class="form-label">Job Title</label>
              <input type="text" class="form-control" id="empTitle" placeholder="e.g. Field Technician">
            </div>
            <div class="col-md-6">
              <label class="form-label">Assign Manager</label>
              <select class="form-select" id="empManager" required></select>
            </div>
            <div class="col-12" id="empPasswordWrap">
              <label class="form-label">Temporary Password</label>
              <input type="text" class="form-control" id="empPassword" value="password123">
              <div class="form-text">The employee should change this after first login.</div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="employeeSubmitBtn">Create Employee</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Reset Password Modal -->
<div class="modal fade" id="resetPasswordModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-display">Reset Password</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted-fw small">Set a new temporary password for <strong id="resetPasswordUserName"></strong>.</p>
        <input type="hidden" id="resetPasswordUserId">
        <label class="form-label">New Password</label>
        <input type="text" class="form-control" id="newPasswordInput" value="password123">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="confirmResetPasswordBtn">Reset Password</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/employee-management.js"></script>
</body>
</html>
