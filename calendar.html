<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar · FieldPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css' rel='stylesheet' />
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- App Preloader -->
<div id="app-preloader" aria-hidden="true">
  <div class="preloader-center">
    <div class="preloader-mark">FW</div>
    <div class="preloader-brand">FieldPro</div>
    <div class="preloader-spinner"></div>
  </div>
  <div class="preloader-footer">
    <div class="preloader-singer-badge">
      <img src="assets/img/singer-logo.png" alt="Singer Sri Lanka PLC">
    </div>
    <div class="preloader-credit">Designed by : Shanuka Herath</div>
  </div>
</div>
<script>
(function () {
  var el = document.getElementById('app-preloader');
  if (!el) return;
  var MIN_MS = 500, start = Date.now();
  function hide() {
    var wait = Math.max(0, MIN_MS - (Date.now() - start));
    setTimeout(function () {
      el.classList.add('is-hidden');
      setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 500);
    }, wait);
  }
  if (document.readyState === 'complete') hide();
  else window.addEventListener('load', hide);
  setTimeout(hide, 3000); // safety fallback in case load never fires
})();
</script>
<div class="app-wrapper">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main-content">
    <header id="topbar" class="topbar"></header>

    <main class="page-content">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
          <h2 class="fw-display fw-bold mb-1">Calendar</h2>
          <p class="text-muted-fw mb-0">Tasks, reminders, deadlines and work logs — all in one view.</p>
        </div>
        <div class="d-flex flex-wrap gap-3">
          <span class="small"><span class="legend-dot" style="background:#3457D5;"></span>Tasks</span>
          <span class="small"><span class="legend-dot" style="background:#EF4444;"></span>High Priority / Overdue</span>
          <span class="small"><span class="legend-dot" style="background:#14B8A6;"></span>Work Logs</span>
          <span class="small"><span class="legend-dot" style="background:#8B5CF6;"></span>Reminders</span>
        </div>
      </div>

      <div class="card section-card">
        <div class="card-body">
          <div id="fullCalendarEl"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Event details modal -->
<div class="modal fade" id="eventDetailsModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-display" id="eventDetailsTitle">Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="eventDetailsBody"></div>
      <div class="modal-footer" id="eventDetailsFooter"></div>
    </div>
  </div>
</div>

<!-- Quick add on date click -->
<div class="modal fade" id="calendarQuickAddModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-display">Add Task</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="calendarQuickAddForm">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" class="form-control" id="cqTitle" required>
          </div>
          <div class="row g-3">
            <div class="col-6">
              <label class="form-label">Priority</label>
              <select class="form-select" id="cqPriority"><option>High</option><option selected>Medium</option><option>Low</option></select>
            </div>
            <div class="col-6">
              <label class="form-label">Due Date</label>
              <input type="date" class="form-control" id="cqDueDate" required>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Add Task</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js'></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/calendar.js"></script>
</body>
</html>
