<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Logs · FieldPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- App Preloader -->
<div id="app-preloader" aria-hidden="true">
  <div class="preloader-center">
    <div class="preloader-mark">FW</div>
    <div class="preloader-brand">FieldPro</div>
    <div class="preloader-spinner"></div>
  </div>
  <div class="preloader-footer">
    <div class="preloader-singer-badge">
      <img src="assets/img/singer-logo.png" alt="Singer Sri Lanka PLC">
    </div>
    <div class="preloader-credit">Designed by : Shanuka Herath</div>
  </div>
</div>
<script>
(function () {
  var el = document.getElementById('app-preloader');
  if (!el) return;
  var MIN_MS = 500, start = Date.now();
  function hide() {
    var wait = Math.max(0, MIN_MS - (Date.now() - start));
    setTimeout(function () {
      el.classList.add('is-hidden');
      setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 500);
    }, wait);
  }
  if (document.readyState === 'complete') hide();
  else window.addEventListener('load', hide);
  setTimeout(hide, 3000); // safety fallback in case load never fires
})();
</script>
<div class="app-wrapper">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main-content">
    <header id="topbar" class="topbar"></header>

    <main class="page-content">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
          <h2 class="fw-display fw-bold mb-1">Work Logs</h2>
          <p class="text-muted-fw mb-0" id="workLogSubtitle">Detailed record of every site visit.</p>
        </div>
        <button class="btn btn-primary d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#workLogModal" id="openAddLogBtn">
          <span class="material-symbols-outlined" style="font-size:20px;">add</span> Add Work Log
        </button>
      </div>

      <!-- Filters -->
      <div class="filter-bar mb-4">
        <div class="row g-2 align-items-end">
          <div class="col-md-3" id="filterEmployeeWrap" style="display:none;">
            <label class="form-label mb-1">Employee</label>
            <select class="form-select" id="filterEmployee"><option value="">All Employees</option></select>
          </div>
          <div class="col-md-3">
            <label class="form-label mb-1">Client</label>
            <input type="text" class="form-control" id="filterClient" placeholder="Search client...">
          </div>
          <div class="col-md-2">
            <label class="form-label mb-1">From</label>
            <input type="date" class="form-control" id="filterDateFrom">
          </div>
          <div class="col-md-2">
            <label class="form-label mb-1">To</label>
            <input type="date" class="form-control" id="filterDateTo">
          </div>
          <div class="col-md-2">
            <label class="form-label mb-1">Status</label>
            <select class="form-select" id="filterStatus">
              <option value="">All</option><option>Completed</option><option>In Progress</option><option>Pending</option>
            </select>
          </div>
          <div class="col-md-12 text-end">
            <button class="btn btn-light btn-sm mt-2" id="clearFiltersBtn">Clear Filters</button>
          </div>
        </div>
      </div>

      <div class="card section-card">
        <div class="card-body p-0">
          <div class="table-responsive-card">
            <table class="table table-hover mb-0">
              <thead>
                <tr>
                  <th id="employeeColHeader" style="display:none;">Employee</th>
                  <th>Date</th><th>Client</th><th>Location</th><th>Time</th><th>Time Spent</th><th>Status</th><th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="workLogTableBody">
                <tr><td colspan="8" class="text-center text-muted-fw py-4">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Add / Edit / View Work Log Modal -->
<div class="modal fade" id="workLogModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-display" id="workLogModalTitle">Add Work Log</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="workLogForm">
        <input type="hidden" id="wlId">
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Date</label>
              <input type="date" class="form-control" id="wlDate" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Start Time</label>
              <input type="time" class="form-control" id="wlStartTime" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">End Time</label>
              <input type="time" class="form-control" id="wlEndTime" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Client Name</label>
              <input type="text" class="form-control" id="wlClient" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Location</label>
              <input type="text" class="form-control" id="wlLocation" required>
            </div>
            <div class="col-12">
              <label class="form-label">Work Description</label>
              <textarea class="form-control" id="wlDescription" rows="2" required></textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label">Issue Identified</label>
              <textarea class="form-control" id="wlIssue" rows="2"></textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label">Action Taken</label>
              <textarea class="form-control" id="wlAction" rows="2"></textarea>
            </div>
            <div class="col-md-4">
              <label class="form-label">Time Spent</label>
              <input type="text" class="form-control" id="wlTimeSpent" placeholder="e.g. 1h 30m">
            </div>
            <div class="col-md-4">
              <label class="form-label">Status</label>
              <select class="form-select" id="wlStatus">
                <option>Completed</option><option>In Progress</option><option>Pending</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Attachment</label>
              <input type="file" class="form-control" id="wlAttachment">
              <div class="form-text" id="wlExistingAttachment"></div>
            </div>
            <div class="col-12">
              <label class="form-label">Remarks</label>
              <textarea class="form-control" id="wlRemarks" rows="2"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="workLogSubmitBtn">Save Work Log</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/work-log.js"></script>
</body>
</html>
