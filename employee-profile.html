<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Profile · FieldPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- App Preloader -->
<div id="app-preloader" aria-hidden="true">
  <div class="preloader-center">
    <div class="preloader-mark">FW</div>
    <div class="preloader-brand">FieldPro</div>
    <div class="preloader-spinner"></div>
  </div>
  <div class="preloader-footer">
    <div class="preloader-singer-badge">
      <img src="assets/img/singer-logo.png" alt="Singer Sri Lanka PLC">
    </div>
    <div class="preloader-credit">Designed by : Shanuka Herath</div>
  </div>
</div>
<script>
(function () {
  var el = document.getElementById('app-preloader');
  if (!el) return;
  var MIN_MS = 500, start = Date.now();
  function hide() {
    var wait = Math.max(0, MIN_MS - (Date.now() - start));
    setTimeout(function () {
      el.classList.add('is-hidden');
      setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 500);
    }, wait);
  }
  if (document.readyState === 'complete') hide();
  else window.addEventListener('load', hide);
  setTimeout(hide, 3000); // safety fallback in case load never fires
})();
</script>
<div class="app-wrapper">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main-content">
    <header id="topbar" class="topbar"></header>

    <main class="page-content">
      <!-- Profile header -->
      <div class="card section-card mb-4">
        <div class="card-body p-4">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div class="d-flex align-items-center gap-3">
              <div class="avatar-lg" id="profileAvatar">--</div>
              <div>
                <h2 class="fw-display fw-bold mb-1" id="profileName">Loading...</h2>
                <div class="text-muted-fw" id="profileTitle"></div>
                <div class="mt-1" id="profileStatusPill"></div>
              </div>
            </div>
            <div class="d-flex gap-2" id="profileActionButtons"></div>
          </div>
          <hr>
          <div class="row g-3">
            <div class="col-6 col-md-3">
              <div class="small text-muted-fw">Email</div>
              <div class="fw-semibold" id="profileEmail">—</div>
            </div>
            <div class="col-6 col-md-3">
              <div class="small text-muted-fw">Phone</div>
              <div class="fw-semibold" id="profilePhone">—</div>
            </div>
            <div class="col-6 col-md-3">
              <div class="small text-muted-fw">Reports To</div>
              <div class="fw-semibold" id="profileManager">—</div>
            </div>
            <div class="col-6 col-md-3">
              <div class="small text-muted-fw">Joined</div>
              <div class="fw-semibold" id="profileJoinDate">—</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Stat cards -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3">
          <div class="stat-card"><div class="stat-value" id="pStatTotal">--</div><div class="stat-label">Total Tasks</div></div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card accent-warning"><div class="stat-value" id="pStatPending">--</div><div class="stat-label">Pending</div></div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card accent-success"><div class="stat-value" id="pStatCompleted">--</div><div class="stat-label">Completed</div></div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card accent-danger"><div class="stat-value" id="pStatOverdue">--</div><div class="stat-label">Overdue</div></div>
        </div>
      </div>

      <!-- Tabs -->
      <ul class="nav nav-tabs mb-3" id="profileTabs">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-tasks">Tasks</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-logs">Work Logs</button></li>
      </ul>
      <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-tasks">
          <div class="card section-card">
            <div class="card-body p-0">
              <div class="table-responsive-card">
                <table class="table table-hover mb-0">
                  <thead><tr><th>Title</th><th>Priority</th><th>Due Date</th><th>Status</th></tr></thead>
                  <tbody id="profileTasksTable"><tr><td colspan="4" class="text-center text-muted-fw py-3">Loading...</td></tr></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
        <div class="tab-pane fade" id="tab-logs">
          <div class="card section-card">
            <div class="card-body p-0">
              <div class="table-responsive-card">
                <table class="table table-hover mb-0">
                  <thead><tr><th>Date</th><th>Client</th><th>Location</th><th>Time Spent</th><th>Status</th></tr></thead>
                  <tbody id="profileLogsTable"><tr><td colspan="5" class="text-center text-muted-fw py-3">Loading...</td></tr></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Edit profile modal -->
<div class="modal fade" id="editProfileModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-display">Edit Profile</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="editProfileForm">
        <div class="modal-body">
          <div class="mb-3"><label class="form-label">Full Name</label><input type="text" class="form-control" id="editName" required></div>
          <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" id="editEmail" required></div>
          <div class="mb-3"><label class="form-label">Phone</label><input type="text" class="form-control" id="editPhone"></div>
          <div class="mb-3"><label class="form-label">Title</label><input type="text" class="form-control" id="editTitle"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/employee-profile.js"></script>
</body>
</html>
